name: Deploy family archive to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify data and tests
        run: npm test && npm run validate:data && npm run lint

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Build static site
        env:
          PAGES_BASE_PATH: /clan
        run: npm run build

      - name: Normalize repository path in artifact
        run: |
          if [ -d dist/client/clan ]; then
            cp -R dist/client/clan/. dist/client/
            rm -rf dist/client/clan
          fi
          test -f dist/client/index.html
          test -d dist/client/_next

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist/client

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
